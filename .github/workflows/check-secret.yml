name: Check Signing Secrets

on:
  push:
    paths:
      - '.github/workflows/check-secret.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets prüfen (zeigt nur Längen, nie Werte)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "KEYSTORE_BASE64 Länge: ${#KS_B64}"
          echo "KEYSTORE_PASSWORD Länge: ${#KS_PASS}"
          echo "KEY_ALIAS Länge: ${#KS_ALIAS}"
          if [ -z "$KS_B64" ]; then echo "ERGEBNIS: KEYSTORE_BASE64 ist LEER"; exit 1; fi
          echo "$KS_B64" | base64 -d > ks.jks || { echo "ERGEBNIS: Base64 ungültig"; exit 1; }
          FP=$(keytool -exportcert -alias "$KS_ALIAS" -keystore ks.jks -storepass "$KS_PASS" 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "Zertifikat-Fingerabdruck: $FP"
          if [ "$FP" = "6d7973c4af093ce013d56fce44817f0f795c5436c0a2827b2b8c31d5d921c675" ]; then
            echo "ERGEBNIS: OK, Schlüssel stimmt"
          else
            echo "ERGEBNIS: Schlüssel/Passwort/Alias passen NICHT"; exit 1
          fi
