name: Build Wear OS APK

on:
  push:
  workflow_dispatch:

jobs:
  build-wear:
    name: Wear OS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Einheitliche Build-Nummer (Anzahl Commits)
        run: echo "BUILD_ID=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: dart run intl_utils:generate

      # Fester Signaturschlüssel (nur wenn die Secrets gesetzt sind),
      # damit Updates über die alte App drüberinstalliert werden können.
      - name: Signaturschlüssel einrichten
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/schulportal-release.jks
            printf 'storeFile=schulportal-release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > android/key.properties
            echo "Fester Schlüssel aktiv"
          else
            echo "Kein Schlüssel hinterlegt, Debug-Signatur wird benutzt"
          fi

      - name: Build release APK (arm64)
        run: >
          flutter build apk --release --no-shrink --target-platform android-arm,android-arm64
          --build-name=0.1.0
          --build-number=$((1000 + ${{ env.BUILD_ID }}))
          --dart-define=cronetHttpNoPlay=true
          --dart-define=BUILD_ID=${{ env.BUILD_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: Schulportal-WearOS-build${{ env.BUILD_ID }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Uhr-APK ans Release anhängen
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          F="Schulportal-WearOS-build${{ env.BUILD_ID }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$F"
          TAG="build-${{ env.BUILD_ID }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Build ${{ env.BUILD_ID }}" --notes "$MSG" || true
          gh release upload "$TAG" "$F" --clobber
