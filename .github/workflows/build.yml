name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  # Schnelle Prüfung auf Fehler (ca. 2-3 Minuten), läuft parallel zum APK-Build
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run intl_utils:generate

      - name: Analyze (nur Fehler brechen ab)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: dart run intl_utils:generate

      # Fester Signaturschlüssel (nur wenn die Secrets gesetzt sind),
      # damit Updates über die alte App drüberinstalliert werden können.
      - name: Signaturschlüssel einrichten
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/schulportal-release.jks
            printf 'storeFile=schulportal-release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > android/key.properties
            echo "Fester Schlüssel aktiv"
          else
            echo "Kein Schlüssel hinterlegt, Debug-Signatur wird benutzt"
          fi

      - name: Build release APK (arm64)
        run: >
          flutter build apk --release --no-shrink --split-debug-info=build/symbols --target-platform android-arm,android-arm64
          --build-name=1.0.${{ github.run_number }}
          --build-number=$((1000 + ${{ github.run_number }}))
          --dart-define=cronetHttpNoPlay=true
          --dart-define=BUILD_ID=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Schulportal-APK-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release veröffentlichen (für Auto-Update)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Schulportal-build${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" "Schulportal-build${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "$MSG" || echo "Release fehlgeschlagen (nicht kritisch)"
