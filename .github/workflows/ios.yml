name: iOS App (SwiftUI)

on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build-Nummer (Anzahl Commits)
        run: echo "BUILD_ID=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Neuestes Xcode wählen (für Liquid Glass / iOS-26-SDK)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          cd ios-swift && xcodegen generate
      - name: Bauen (ohne Signatur)
        run: |
          cd ios-swift
          xcodebuild -project Schulportal.xcodeproj -scheme Schulportal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=${{ env.BUILD_ID }} build
      - name: Unsigniertes IPA (iPhone + iPad)
        run: |
          cd ios-swift
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Schulportal.app Payload/
          zip -qry ../Schulportal-iOS-build${{ env.BUILD_ID }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Schulportal-iOS-unsigned
          path: Schulportal-iOS-build${{ env.BUILD_ID }}.ipa
      - name: Als eigener Update-Kanal veröffentlichen (ios-N)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${{ env.BUILD_ID }}"
          F="Schulportal-iOS-build${{ env.BUILD_ID }}.ipa"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "iOS ${{ env.BUILD_ID }}" --notes "Native SwiftUI-App (unsigniert, iPhone + iPad). Per AltStore/Sideloadly installieren."
          gh release upload "$TAG" "$F" --clobber
